[build-system]  
requires = ["setuptools>=68"]  
build-backend = "setuptools.build_meta"

[project]  
name = "itemized-statement"  
version = "1.2.0"  
description = "Ingests daily input file and prints the itemized statements in IDX."  
readme = "README.md"  
requires-python = ">=3.13"  
dependencies = [  
    "alembic>=1.20.1",  
    "loguru>=0.8.0",  
    "openpyxl>=3.1.5",  
    "pandas>=3.1.1",  
    "python-dotenv>=1.2.4",  
    "selenium>=4.52.0",  
    "sqlalchemy>=2.1.8",  
    "sqlmodel>=0.0.50",  
    "tqdm>=4.70.1",  
]

[dependency-groups]  
dev = [
    "bump-my-version>=1.8.1",
    "ipykernel>=7.4.0",
    "poethepoet>=0.49.0",
    "pytest>=9.2.0",
]

[project.scripts]  
itemized-statements = "main:cli"

[tool.setuptools]  
py-modules = ["main", "workflow", "IDXClient"]

[tool.setuptools.packages.find]  
include = ["db*", "utils*", "pages*"]

[tool.pytest.ini_options]  
testpaths = ["tests"]  
pythonpath = ["."]  
addopts = "-q --strict-markers"  

[tool.poe.tasks]  
bump = "bump-my-version bump"  
push = "git push && git push --tags"  
_github_release = { shell = "for /f \"tokens=*\" %%i in ('git describe --tags --abbrev=0') do set TAG=%%i & gh release create %TAG% --generate-notes" }

[tool.poe.tasks.release]  
sequence = [  
    { ref = "bump" },  
    { ref = "push" },  
    { ref = "_github_release" }  
]  

[tool.bumpversion]  
current_version = "1.2.0"  
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"  
serialize = ["{major}.{minor}.{patch}"]  
search = "{current_version}"  
replace = "{new_version}"  
commit = true  
tag = true  
tag_name = "v{new_version}"

# Tell it which files to update the version number in:  
[[tool.bumpversion.file]]  
filename = "pyproject.toml"  
search = "version = \"{current_version}\""  
replace = "version = \"{new_version}\""

# Optional: If you also keep the version in your main package file  
[[tool.bumpversion.file]]  
filename = "src/your_package/__init__.py"  
search = "__version__ = \"{current_version}\""  
replace = "__version__ = \"{new_version}\""  
